$schema: https://azuremlschemas.azureedge.net/latest/commandJob.schema.json
type: command
code: .
command: >-
  echo C211_I120729_DEV_START;
  (nvidia-smi -L || echo NO_NVIDIA_SMI);
  (nvidia-smi --query-gpu=name,uuid,memory.total --format=csv || true);
  (ls -l /dev/nvidia* 2>/dev/null || echo NO_DEV_NVIDIA);
  (for v in /sys/bus/pci/devices/*/vendor; do echo PCI $v `cat $v`; done | grep -Ei '10de|1002' || echo NO_GPU_PCI);
  uname -a;
  echo C211_I120729_DEV_END
inputs:
  training_data:
    type: uri_folder
    path: azureml:diabetes-prod-folder@latest
    mode: direct
outputs:
  metrics_output:
    type: uri_folder
environment:
  image: mcr.microsoft.com/azureml/openmpi4.1.0-cuda11.8-cudnn8-ubuntu22.04:latest
compute: azureml:c211-i120729-n7k4q
experiment_name: c211-i120729
display_name: c211-i120729-gpuprobe
description: c211 i120729 bounded GPU device probe on the nonce AmlCompute cluster
